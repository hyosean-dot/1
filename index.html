<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fff8f1">
  <title>마음 톡톡! 실시간 AI 화상 상담 친구</title>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #fff8f1; color: #34323a; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; min-height: 100dvh; padding: 12px; display: flex; flex-direction: column; align-items: center; }
    button, input, select { font: inherit; }
    button { min-height: 46px; border: 0; border-radius: 14px; cursor: pointer; font-weight: 700; touch-action: manipulation; transition: transform 0.1s; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .app { width: 100%; max-width: 500px; }
    header { text-align: center; margin: 4px 0 12px; }
    header h1 { font-size: 1.45rem; margin: 0; color: #a94c51; }
    header p { margin: 4px 0 0; color: #766a66; font-size: .85rem; }
    .card { background: white; border-radius: 24px; padding: 16px; box-shadow: 0 7px 24px rgba(104, 74, 48, 0.08); margin-bottom: 12px; }
    
    /* 아바타 화상 프레임 */
    .avatar-card { text-align: center; position: relative; }
    .avatar-wrap { width: 185px; height: 185px; margin: 0 auto 10px; border: 4px solid #8cc9df; border-radius: 50%; overflow: hidden; background: #fff0dc; position: relative; box-shadow: inset 0 0 16px rgba(0,0,0,0.06); }
    .avatar-stage { width: 100%; height: 100%; transition: transform 0.12s ease-out; transform-origin: center center; }
    svg { width: 100%; height: 100%; display: block; }
    .pupil-group { transition: transform 0.1s ease-out; }
    
    #camera { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .emotion { font-weight: 700; color: #9a6246; margin: 6px 0; font-size: .95rem; }
    .status { color: #1b6535; background: #e3f7ea; border-radius: 18px; padding: 10px 14px; font-size: .88rem; font-weight: 700; line-height: 1.4; }
    .actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .soft { background: #f1f5f6; color: #41525a; padding: 8px 14px; font-size: .88rem; }
    .soft.active { background: #6c5ce7; color: white; }
    .primary { padding: 12px 18px; background: #ed806e; color: white; font-size: 1.02rem; flex: 1; }
    .primary.live { background: #00b894; }
    
    /* 대화 영역 */
    .top-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .top-bar select { flex: 1; min-height: 44px; border: 2px solid #e8e4e0; border-radius: 12px; padding: 6px 10px; background: white; font-size: 15px; }
    .chat { height: 200px; overflow-y: auto; background: #f7f7f8; padding: 12px; border-radius: 16px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
    .bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; font-size: .95rem; }
    .bubble.ai { background: #e8e7ed; align-self: flex-start; border-bottom-left-radius: 4px; }
    .bubble.user { background: #69acd5; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    
    .text-row { display: flex; gap: 8px; margin-top: 8px; }
    .text-row input { flex: 1; min-width: 0; min-height: 46px; border: 2px solid #e8e4e0; border-radius: 12px; padding: 8px 12px; font-size: 16px; outline: none; }
    .text-row input:focus { border-color: #8cc9df; }
    .text-row button { padding: 0 18px; background: #78b5a9; color: white; flex-shrink: 0; }
    footer { font-size: .76rem; line-height: 1.5; color: #716b69; text-align: center; margin: 6px 0 16px; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>💬 마음 톡톡! 실시간 AI 상담 친구</h1>
      <p>얼굴을 바라보며 표정과 목소리로 대화해요</p>
    </header>

    <section class="card avatar-card" aria-label="화상 아바타">
      <div class="avatar-wrap">
        <div id="avatarStage" class="avatar-stage">
          <svg id="avatar" viewBox="0 0 180 180" role="img" aria-label="실시간 반응형 아바타">
            <circle cx="90" cy="90" r="89" fill="#fff0dc"/>
            <!-- 몸통 -->
            <path d="M22 180q5-43 45-43h46q40 0 45 43" fill="#72b7ae"/>
            <!-- 뒷머리 -->
            <path d="M39 88q-8-62 49-66 63-4 58 61l-8 49q-18 25-48 24-37 0-48-28z" fill="#704b3c"/>
            <!-- 얼굴형 -->
            <path d="M48 82q0-34 42-34t42 34l-4 35q-7 28-38 28t-38-28z" fill="#f4c9aa"/>
            <!-- 앞머리 -->
            <path d="M48 79q-2-42 42-43 49-4 48 41-24-5-42-30-18 28-48 32" fill="#704b3c"/>
            <!-- 볼터치 -->
            <ellipse id="cheekL" cx="61" cy="108" rx="10" ry="5" fill="#e99c94" opacity=".55"/>
            <ellipse id="cheekR" cx="119" cy="108" rx="10" ry="5" fill="#e99c94" opacity=".55"/>
            <!-- 눈썹 -->
            <path id="browL" d="M54 77q12-8 24 0" fill="none" stroke="#704b3c" stroke-width="3" stroke-linecap="round"/>
            <path id="browR" d="M102 77q12-8 24 0" fill="none" stroke="#704b3c" stroke-width="3" stroke-linecap="round"/>
            <!-- 흰자위 -->
            <ellipse cx="67" cy="92" rx="9" ry="7" fill="white"/>
            <ellipse cx="113" cy="92" rx="9" ry="7" fill="white"/>
            <!-- 시선 추적 눈동자 -->
            <g id="pupilGroup" class="pupil-group">
              <circle cx="67" cy="92" r="4.2" fill="#49342f"/>
              <circle cx="68.5" cy="90.5" r="1.3" fill="white"/>
              <circle cx="113" cy="92" r="4.2" fill="#49342f"/>
              <circle cx="114.5" cy="90.5" r="1.3" fill="white"/>
            </g>
            <!-- 코 -->
            <path d="M88 98l-3 9q5 4 10 0" fill="none" stroke="#cc937e" stroke-width="2.5" stroke-linecap="round"/>
            <!-- 립싱크 입 모양 -->
            <ellipse id="mouth" cx="90" cy="121" rx="11" ry="3" fill="#914c50"/>
          </svg>
        </div>
      </div>

      <p class="emotion" id="emotion">다정하게 눈을 맞추고 있어요</p>
      <p class="status" id="status" role="status" aria-live="polite">연결 준비 중...</p>

      <div class="actions">
        <button id="cameraBtn" class="soft" type="button" onclick="window.toggleCam()">📷 내 얼굴 따라오기</button>
        <button id="keyBtn" class="soft" type="button" onclick="window.setApiKey()">🔑 제미나이 키</button>
      </div>
      <video id="camera" autoplay muted playsinline aria-hidden="true"></video>
    </section>

    <section class="card lesson">
      <div class="top-bar">
        <select id="language" aria-label="대화 언어">
          <option value="Korean">🇰🇷 한국어 상담</option>
          <option value="English">🇺🇸 영어 대화</option>
          <option value="Japanese">🇯🇵 일본어 대화</option>
        </select>
        <button class="soft" type="button" onclick="window.resetChat()">🔄 새로 시작</button>
      </div>

      <div id="chat" class="chat" role="log" aria-label="대화 내용" aria-live="polite">
        <div class="bubble ai">안녕! 나는 너의 다정한 AI 상담 친구야. 카메라를 켜면 내가 너를 바라보며 대화할 수 있어. 오늘 어떤 일이 있었어?</div>
      </div>

      <div class="actions">
        <button id="listenBtn" class="primary" type="button" onclick="window.startVoiceCall()">🎙️ 실시간 음성 대화 시작</button>
        <button id="stopBtn" class="soft" type="button" onclick="window.stopVoiceCall()" disabled>⏹ 대화 멈춤</button>
      </div>

      <div class="text-row">
        <input id="message" type="text" maxlength="500" autocomplete="off" placeholder="글자로 입력해도 목소리로 대답해요..." aria-label="메시지 입력" onkeydown="if(event.key==='Enter' && !event.isComposing) window.sendText()">
        <button id="sendBtn" type="button" onclick="window.sendText()">보내기</button>
      </div>
    </section>

    <footer>스마트폰·패드 브라우저 메뉴에서 [홈 화면에 추가]를 누르면 앱처럼 바로 실행됩니다.</footer>
  </main>

  <script>
    var GEMINI_API_KEY = localStorage.getItem('gemini_api_key') || '';
    var recognition = null;
    var isVoiceCallActive = false;
    var isSpeaking = false;
    var speechTimer = null;
    var cameraStream = null;
    var faceDetector = null;
    var animFrameId = 0;
    var historyLog = new Array();

    function $(id) {
      return document.getElementById(id);
    }

    function setStatus(text) {
      var el = $('status');
      if (el) el.textContent = text;
    }

    function addBubble(text, who) {
      var chat = $('chat');
      var div = document.createElement('div');
      div.className = 'bubble ' + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // 감정 태그에 따른 아바타 표정(눈썹, 볼터치, 안내 문구) 변화
    function setExpression(mood) {
      var browL = $('browL');
      var browR = $('browR');
      var cheekL = $('cheekL');
      var cheekR = $('cheekR');
      var label = $('emotion');

      if (mood === 'happy') {
        browL.setAttribute('d', 'M54 73q12-10 24 0');
        browR.setAttribute('d', 'M102 73q12-10 24 0');
        cheekL.setAttribute('opacity', '0.85');
        cheekR.setAttribute('opacity', '0.85');
        label.textContent = '밝고 기쁘게 웃으며 듣고 있어요 ✨';
      } else if (mood === 'sad') {
        browL.setAttribute('d', 'M54 79q12-2 24-5');
        browR.setAttribute('d', 'M102 74q12 3 24 5');
        cheekL.setAttribute('opacity', '0.35');
        cheekR.setAttribute('opacity', '0.35');
        label.textContent = '진심으로 공감하며 위로하고 있어요 🌱';
      } else if (mood === 'thinking') {
        browL.setAttribute('d', 'M54 76q12-6 24 0');
        browR.setAttribute('d', 'M102 72q12-8 24-2');
        label.textContent = '곰곰이 생각을 정리하고 있어요 💭';
      } else {
        browL.setAttribute('d', 'M54 77q12-8 24 0');
        browR.setAttribute('d', 'M102 77q12-8 24 0');
