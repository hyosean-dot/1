<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff8f1">
  <title>마음 톡톡! AI 상담 친구</title>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #fff8f1; color: #34323a; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; min-height: 100dvh; padding: 14px; }
    button, input, select { font: inherit; }
    button { min-height: 46px; border: 0; border-radius: 14px; cursor: pointer; font-weight: 700; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .app { max-width: 520px; margin: 0 auto; }
    header { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 4px 0 14px; text-align: center; }
    header > span { font-size: 34px; color: #ed7d70; }
    h1 { font-size: 1.5rem; margin: 0; color: #a94c51; }
    header p { margin: 2px 0 0; color: #766a66; font-size: .88rem; }
    .card { background: white; border-radius: 24px; padding: 16px; box-shadow: 0 7px 24px #684a3012; margin-bottom: 12px; }
    .avatar-card { text-align: center; }
    .avatar-wrap { width: 165px; height: 165px; margin: 0 auto 8px; border: 4px solid #8cc9df; border-radius: 50%; overflow: hidden; background: #fff0dc; }
    svg { width: 100%; height: 100%; }
    #camera { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .emotion { font-weight: 700; color: #9a6246; margin: 6px; font-size: .95rem; }
    .status { color: #346b83; background: #e8f5fb; border-radius: 18px; padding: 10px; font-size: .9rem; font-weight: 600; }
    .actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .soft { background: #f1f5f6; color: #41525a; padding: 8px 14px; }
    .primary { padding: 10px 18px; background: #ed806e; color: white; font-size: 1rem; flex: 1; }
    .lesson > label { display: block; font-weight: 700; margin-bottom: 6px; font-size: .92rem; }
    .lesson select, .text-row input { width: 100%; min-height: 46px; border: 2px solid #e8e4e0; border-radius: 12px; padding: 8px 12px; background: white; font-size: 16px; }
    .consent-box { margin-top: 10px; padding: 10px 12px; border: 1px solid #eadbd2; border-radius: 14px; background: #fffaf6; text-align: left; }
    .consent-label { display: flex; align-items: flex-start; gap: 9px; line-height: 1.45; font-size: .85rem; cursor: pointer; }
    .consent-label input { width: 20px; height: 20px; flex: 0 0 auto; margin: 2px 0 0; accent-color: #70a99e; }
    .chat { height: 210px; overflow-y: auto; background: #f7f7f8; padding: 12px; border-radius: 15px; margin: 12px 0; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
    .bubble { max-width: 86%; padding: 10px 13px; border-radius: 15px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; font-size: .95rem; }
    .bubble.ai { background: #e8e7ed; align-self: flex-start; }
    .bubble.user { background: #69acd5; color: white; align-self: flex-end; }
    .text-row { display: flex; gap: 8px; margin-top: 8px; }
    .text-row input { min-width: 0; }
    .text-row button { padding: 0 18px; background: #78b5a9; color: white; flex-shrink: 0; }
    footer { font-size: .78rem; line-height: 1.5; color: #716b69; text-align: center; margin: 10px 0; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <span aria-hidden="true">✿</span>
      <div>
        <h1>마음 톡톡! AI 상담 친구</h1>
        <p>카메라를 켜면 내 얼굴을 따라 눈동자가 움직여요</p>
      </div>
    </header>

    <section class="card avatar-card" aria-label="아바타">
      <div class="avatar-wrap">
        <svg id="avatar" viewBox="0 0 180 180" role="img" aria-label="다정한 상담 아바타">
          <circle cx="90" cy="90" r="89" fill="#fff0dc"/>
          <path d="M22 180q5-43 45-43h46q40 0 45 43" fill="#72b7ae"/>
          <path d="M39 88q-8-62 49-66 63-4 58 61l-8 49q-18 25-48 24-37 0-48-28z" fill="#704b3c"/>
          <path d="M48 79q-2-42 42-43 49-4 48 41-24-5-42-30-18 28-48 32" fill="#704b3c"/>
          <path d="M48 82q0-34 42-34t42 34l-4 35q-7 28-38 28t-38-28z" fill="#f4c9aa"/>
          <ellipse cx="61" cy="108" rx="10" ry="5" fill="#e99c94" opacity=".55"/>
          <ellipse cx="119" cy="108" rx="10" ry="5" fill="#e99c94" opacity=".55"/>
          <path id="browL" d="M54 77q12-8 24 0" fill="none" stroke="#704b3c" stroke-width="3" stroke-linecap="round"/>
          <path id="browR" d="M102 77q12-8 24 0" fill="none" stroke="#704b3c" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="67" cy="92" rx="9" ry="7" fill="white"/>
          <ellipse cx="113" cy="92" rx="9" ry="7" fill="white"/>
          <circle id="pupilL" cx="67" cy="92" r="4" fill="#49342f"/>
          <circle id="pupilR" cx="113" cy="92" r="4" fill="#49342f"/>
          <path d="M88 98l-3 9q5 4 10 0" fill="none" stroke="#cc937e" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse id="mouth" cx="90" cy="120" rx="12" ry="3" fill="#914c50"/>
        </svg>
      </div>
      <p class="emotion" id="emotion">오늘은 어떤 이야기를 나눠볼까?</p>
      <p class="status" id="status" role="status" aria-live="polite">아래 [🎙️ 말하기 시작] 버튼을 눌러 대화를 시작하세요!</p>
      <div class="actions">
        <button id="cameraBtn" class="soft" type="button" aria-pressed="false">📷 얼굴 따라가기 켜기</button>
        <button id="keyBtn" class="soft" type="button">🔑 API 키 변경</button>
      </div>
      <video id="camera" autoplay muted playsinline aria-hidden="true"></video>
    </section>

    <section class="card lesson">
      <label for="language">대화 언어 선택</label>
      <select id="language">
        <option value="Korean">🇰🇷 한국어</option>
        <option value="English">🇺🇸 영어</option>
        <option value="Japanese">🇯🇵 일본어</option>
        <option value="Spanish">🇪🇸 스페인어</option>
        <option value="French">🇫🇷 프랑스어</option>
      </select>

      <div class="consent-box">
        <label class="consent-label">
          <input id="guardianConsent" type="checkbox" checked>
          <span>보호자·선생님과 안내를 확인했어요. 카메라 영상은 이 기기 안에서만 처리되며, 대화 내용은 AI 응답을 위해 전송됩니다.</span>
        </label>
      </div>

      <div id="chat" class="chat" role="log" aria-label="대화 내용" aria-live="polite">
        <div class="bubble ai">안녕! 나는 너의 다정한 마음 상담 친구야. 오늘 어떤 일이 있었어? 편하게 말해줘!</div>
      </div>

      <div class="actions">
        <button id="listenBtn" class="primary" type="button">🎙️ 말하기 시작</button>
        <button id="stopBtn" class="soft" type="button" disabled>⏹ 중지</button>
      </div>

      <div class="text-row">
        <input id="message" type="text" maxlength="500" autocomplete="off" placeholder="글자로 입력해도 좋아요..." aria-label="메시지 입력">
        <button id="sendBtn" type="button">보내기</button>
      </div>
    </section>

    <footer>이름·주소·학교·전화번호 등 개인정보는 말하거나 입력하지 마세요.</footer>
  </main>

  <script>
    (function() {
      const $ = (id) => document.getElementById(id);
      const chat = $('chat');
      const statusEl = $('status');
      const recognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

      let GEMINI_API_KEY = localStorage.getItem('gemini_api_key') || 'AQ.Ab8RN6IQgkImAImPi3dziv0C15lVUUO5pQG-AnH-SVcWMN2Ehw';
      let recognition = null;
      let speechTimer = null;
      let cameraStream = null;
      let faceDetector = null;
      let animFrameId = 0;
      const historyLog = [];

      const vowelMap = {
        'ㅏ':'a','ㅐ':'a','ㅑ':'a','ㅒ':'a','ㅓ':'e','ㅔ':'e','ㅕ':'e','ㅖ':'e','ㅗ':'o','ㅛ':'o','ㅜ':'u','ㅠ':'u','ㅡ':'e','ㅣ':'i',
        'ㅘ':'a','ㅙ':'a','ㅚ':'e','ㅝ':'e','ㅞ':'e','ㅟ':'i','ㅢ':'e'
      };

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function addBubble(text, who) {
        const div = document.createElement('div');
        div.className = 'bubble ' + who;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function updateMood(text) {
        const val = String(text || '').toLowerCase();
        if (/잘했|멋져|좋아|축하|기뻐|신나|행복|great|good/.test(val)) {
          $('emotion').textContent = '와, 정말 기분 좋은 일이구나! ✨';
        } else if (/힘들|속상|걱정|괜찮|천천히|슬퍼|위로|어려/.test(val)) {
          $('emotion').textContent = '괜찮아, 내가 네 편이 되어줄게 🌱';
        } else {
          $('emotion').textContent = '다정하게 듣고 있어! 계속 말해볼까?';
        }
      }

      function getHangulVowel(ch) {
        const code = ch.charCodeAt(0) - 0xac00;
        if (code < 0 || code > 11171) return null;
        const list = Array.of('ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ');
        return list.at(Math.floor(code / 28 / 21));
      }

      function getMouthShapes(text) {
        const seq = [];
        for (const ch of text) {
          if (/[가-힣]/.test(ch)) {
            const v = getHangulVowel(ch);
            if (v) seq.push(vowelMap[v] || 'e');
          } else if (/[aeiou]/i.test(ch)) {
            seq.push(ch.toLowerCase());
          }
        }
        return seq.length ? seq : Array.of('e');
      }

      function setMouth(shape) {
        const sizes = {
          a: { rx: 8, ry: 7 },
          e: { rx: 11, ry: 4 },
          i: { rx: 6, ry: 3 },
          o: { rx: 5, ry: 9 },
          u: { rx: 4, ry: 7 },
          rest: { rx: 12, ry: 3 }
        };
        const s = sizes[shape] || sizes.rest;
        $('mouth').setAttribute('rx', String(s.rx));
        $('mouth').setAttribute('ry', String(s.ry));
      }

      function stopMouth() {
        if (speechTimer) {
          clearTimeout(speechTimer);
          speechTimer = null;
        }
        setMouth('rest');
      }

      function speak(text, langVal) {
        if (!('speechSynthesis' in window)) return;
