<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff8f1"><meta name="description" content="말하며 배우는 언어 친구"><title>마음 톡톡! 언어 배우는 AI 친구</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="app"><header><span aria-hidden="true">✿</span><div><h1>마음 톡톡!</h1><p>말하며 배우는 언어 친구</p></div></header>
<section class="card avatar-card" aria-label="아바타"><div class="avatar-wrap"><svg id="avatar" viewBox="0 0 180 180" role="img" aria-label="다정한 아바타"><circle cx="90" cy="90" r="89" fill="#fff0dc"/><path d="M22 180q5-43 45-43h46q40 0 45 43" fill="#72b7ae"/><path d="M39 88q-8-62 49-66 63-4 58 61l-8 49q-18 25-48 24-37 0-48-28z" fill="#704b3c"/><path d="M48 79q-2-42 42-43 49-4 48 41-24-5-42-30-18 28-48 32" fill="#704b3c"/><path d="M48 82q0-34 42-34t42 34l-4 35q-7 28-38 28t-38-28z" fill="#f4c9aa"/><ellipse cx="61" cy="108" rx="10" ry="5" fill="#e99c94" opacity=".55"/><ellipse cx="119" cy="108" rx="10" ry="5" fill="#e99c94" opacity=".55"/><path id="browL" d="M54 77q12-8 24 0" fill="none" stroke="#704b3c" stroke-width="3" stroke-linecap="round"/><path id="browR" d="M102 77q12-8 24 0" fill="none" stroke="#704b3c" stroke-width="3" stroke-linecap="round"/><ellipse cx="67" cy="92" rx="9" ry="7" fill="white"/><ellipse cx="113" cy="92" rx="9" ry="7" fill="white"/><circle id="pupilL" cx="67" cy="92" r="4" fill="#49342f"/><circle id="pupilR" cx="113" cy="92" r="4" fill="#49342f"/><path d="M88 98l-3 9q5 4 10 0" fill="none" stroke="#cc937e" stroke-width="2.5" stroke-linecap="round"/><ellipse id="mouth" cx="90" cy="120" rx="12" ry="3" fill="#914c50"/></svg></div>
<p class="emotion" id="emotion">오늘은 어떤 말을 배워볼까?</p><p class="status" id="status" role="status" aria-live="polite">언어를 고르고 대화를 시작해 봐!</p><div class="actions"><button id="cameraBtn" class="soft" type="button" aria-pressed="false">📷 얼굴 따라가기</button></div><video id="camera" autoplay muted playsinline aria-hidden="true"></video></section>
<section class="card lesson"><label for="language">오늘 연습할 언어</label><select id="language"><option value="English">🇺🇸 영어</option><option value="Korean">🇰🇷 한국어</option><option value="Japanese">🇯🇵 일본어</option><option value="Spanish">🇪🇸 스페인어</option><option value="French">🇫🇷 프랑스어</option></select><div id="chat" class="chat" role="log" aria-label="대화 내용" aria-live="polite"><div class="bubble ai">안녕! 나는 너의 언어 친구야. 오늘 어떤 말을 배워볼까?</div></div><div class="actions"><button id="listenBtn" class="primary" type="button">🎙️ 말하기 시작</button><button id="stopBtn" class="soft" type="button" disabled>⏹ 말하기 중지</button></div><div class="text-row"><input id="message" type="text" maxlength="300" autocomplete="off" placeholder="글로도 말할 수 있어요" aria-label="메시지 입력"><button id="sendBtn" type="button">보내기</button></div><p class="privacy">이 페이지는 대화 내용을 저장하지 않아요. AI 답변을 위해 텍스트가 Google Gemini로 전송됩니다. 음성 인식은 브라우저 기능을 사용합니다.</p></section>
<footer>어린이는 보호자와 함께 사용해 주세요. 이름, 주소, 학교 등 개인정보를 말하거나 입력하지 마세요.</footer></main><script type="module" src="/app.js"></script></body></html>
